  <style>
    :root{
      --bg:#1B1F24;
      --bg2:#23282F;
      --card:#2B313A;
      --line:#3C454F;
      --ink:#E6EBF0;
      --ink-light:#A6B2BD;
      --muted:#6E7B87;
      --steel:#5BA3D9;
      --steel-deep:#2E6FA8;
      --orange:#FF7A29;
      --orange-deep:#E85D04;
      --weld:#FFD166;
      --silver:#C7CED6;
      --red:#EF5350;
      --radius:10px;
      --maxw:1180px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);color:var(--ink);line-height:1.75;font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}

    header.nav{position:sticky;top:0;z-index:50;background:rgba(27,31,36,.96);backdrop-filter:blur(12px);border-bottom:3px solid var(--orange)}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;height:66px}
    .logo{font-weight:900;font-size:21px;display:flex;align-items:center;gap:10px;letter-spacing:.5px}
    .logo .gear{width:26px;height:26px;position:relative;border:3px solid var(--steel);border-radius:50%}
    .logo .gear::before{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--orange)}
    .logo .gear::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:5px;height:5px;background:var(--steel);box-shadow:0 18px 0 var(--steel),9px 9px 0 var(--steel),-9px 9px 0 var(--steel)}
    .logo b{color:var(--orange)}
    .logo span{color:var(--ink)}
    nav.menu{display:flex;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
    nav.menu a{padding:8px 14px;border-radius:6px;border:1px solid transparent;transition:.2s}
    nav.menu a:hover{color:var(--ink);border-color:var(--line);background:var(--bg2)}
    .nav-toggle{display:none;background:none;border:1px solid var(--orange);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:18px;cursor:pointer}

    .hero{padding:74px 0 80px;background:
      radial-gradient(620px 360px at 82% 8%,rgba(255,122,41,.12),transparent 60%),
      radial-gradient(420px 240px at 6% 94%,rgba(91,163,217,.10),transparent 60%),
      repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(199,206,214,.025) 38px 40px),
      linear-gradient(180deg,#23282F,#1B1F24);position:relative;overflow:hidden}
    .hero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
    .pill{display:inline-block;background:var(--orange-deep);color:#fff;font-size:11px;font-weight:800;padding:5px 16px;border-radius:4px;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px}
    .disclaim{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:var(--red);border:1px dashed var(--red);border-radius:4px;padding:4px 12px;vertical-align:middle}
    .hero h1{font-size:clamp(30px,5.5vw,50px);line-height:1.08;margin:0 0 14px;font-weight:900;letter-spacing:.5px}
    .hero h1 em{font-style:normal;color:var(--steel)}
    .hero h1 .ink-em{color:var(--weld)}
    .hero p.lead{font-size:16px;color:var(--ink-light);max-width:640px;margin:0 0 22px}
    .hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
    .hero-tag{border:1px solid var(--line);border-radius:6px;padding:5px 13px;font-size:13px;font-weight:600;background:var(--card)}
    .cta{display:flex;gap:12px;flex-wrap:wrap}
    .btn{padding:13px 26px;border-radius:8px;font-weight:800;font-size:15px;transition:.2s;display:inline-flex;gap:6px;align-items:center;cursor:pointer}
    .btn-primary{background:var(--orange);color:#1B1F24;border:2px solid var(--orange)}
    .btn-primary:hover{background:var(--orange-deep);border-color:var(--orange-deep);color:#fff}
    .btn-ghost{border:1px solid var(--silver);color:var(--ink);background:transparent}
    .btn-ghost:hover{background:var(--silver);color:var(--bg)}

    /* 齿轮流水线 */
    .factory-stage{width:300px;height:300px;margin:0 auto;position:relative;background:linear-gradient(160deg,#2B313A,#1B1F24);border-radius:12px;border:3px solid var(--line);box-shadow:inset 0 0 40px rgba(0,0,0,.4);overflow:hidden;display:flex;align-items:center;justify-content:center}
    .belt{position:absolute;bottom:46px;left:0;right:0;height:14px;background:repeating-linear-gradient(90deg,var(--steel) 0 10px,transparent 10px 20px);opacity:.5;animation:belt 1.2s linear infinite}
    @keyframes belt{to{background-position:-20px 0}}
    .gear-big{position:absolute;top:40px;left:36px;width:120px;height:120px;border-radius:50%;border:14px dashed var(--steel);animation:spin 8s linear infinite}
    .gear-sm{position:absolute;top:96px;right:40px;width:72px;height:72px;border-radius:50%;border:10px dashed var(--orange);animation:spin 5s linear reverse infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .reel{position:relative;z-index:2;width:90px;height:90px;border-radius:8px;background:linear-gradient(135deg,var(--weld),var(--orange));box-shadow:0 0 24px rgba(255,209,102,.4);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#1B1F24}
    .stage-label{position:absolute;bottom:14px;font-size:11px;letter-spacing:3px;color:var(--steel);font-weight:800;z-index:2}

    section{padding:60px 0;border-bottom:1px dashed var(--line)}
    .sec-head{margin-bottom:32px;text-align:center}
    .sec-head .kicker{color:var(--orange);font-weight:800;letter-spacing:2px;text-transform:uppercase;font-size:11px}
    .sec-head h2{font-size:clamp(24px,4vw,34px);margin:6px 0 8px;font-weight:900}
    .sec-head p{color:var(--muted);margin:0 auto;max-width:700px;font-size:14px}

    .why{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .why-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
    .why-card.bad{border-left:5px solid var(--red)}
    .why-card.good{border-left:5px solid var(--steel)}
    .why-card h3{margin:0 0 12px;font-size:17px;font-weight:800;display:flex;align-items:center;gap:8px}
    .why-card ul{margin:0;padding-left:18px;color:var(--ink-light);font-size:13px}
    .why-card ul li{margin:6px 0}

    .cats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .cat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;text-align:center;transition:.3s}
    .cat:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(255,122,41,.14);border-color:var(--orange)}
    .cat .ic{font-size:34px;display:block;margin-bottom:10px}
    .cat h3{margin:0 0 6px;font-size:15px;font-weight:800}
    .cat p{margin:0;color:var(--muted);font-size:12px}

    .term-list{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .film{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;transition:.3s;position:relative;overflow:hidden}
    .film-top
